<!-- notifications.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    
</head>
<body>
    <h1>Notifications</h1>
    <ul>
        {% for notification in notifications %}
            <li>{{ notification.action_user.username }} {{ notification.action }} at {{ notification.timestamp }}</li>
        {% endfor %}
    </ul>

   
</body>
</html>
